New:
  - >-
    Pass `topk_sample_logprobs=k` to [`SamplingClient.sample()`](https://tinker-docs.thinkingmachines.ai/tinker/api-reference/samplingclient/#sample)
    to return the top token alternatives at each generated position. Read each sequence’s `.topk_logprobs`
    as token-ID/log-probability pairs or `.topk_logprobs_np` as arrays.
