[project]
name = "tinker"
version = "0.39.1"
description = "The official Python SDK for the tinker API"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
{ name = "Tinker authors", email = "tinker@thinkingmachines.ai" },
]
keywords = ["tinker", "machine learning"]
dependencies = [
    "httpx[http2]>=0.23.0, <1",
    "pyqwest>=0.4.1",
    "pydantic>=1.9.0, <3",
    "typing-extensions>=4.10, <5",
    "anyio>=3.5.0, <5",
    "distro>=1.7.0, <2",
    "sniffio",
    "numpy",
    "protobuf>=4.21",
    "transformers",
    "tiktoken",
    "rich>=13.0.0",
    "click>=8.0.0",
    "orjson>=3.10.0",
    "zstandard>=0.24.0",
]

requires-python = ">= 3.11"
classifiers = [
  "Typing :: Typed",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Operating System :: OS Independent",
  "Operating System :: POSIX",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Operating System :: Microsoft :: Windows",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "License :: OSI Approved :: Apache Software License"
]

[project.scripts]
tinker = "tinker.cli.__main__:cli"

[project.urls]
Homepage = "https://thinkingmachines.ai/tinker"
Repository = "https://github.com/thinking-machines-lab/tinker"
Documentation = "https://tinker-docs.thinkingmachines.ai/"
Changelog = "https://tinker-docs.thinkingmachines.ai/changelog/sdk/"

[project.optional-dependencies]
aiohttp = ["aiohttp", "httpx_aiohttp>=0.1.8"]
torch = ["torch"]

[tool.uv]
managed = true
required-version = ">=0.5.0"
# version pins are in uv.lock

[dependency-groups]
dev = [
    "pyright==1.1.408",
    "mypy",
    "respx",
    "pytest",
    "pytest-asyncio",
    "ruff",
    "time-machine",
    "dirty-equals>=0.6.0",
    "importlib-metadata>=6.7.0",
    "rich>=13.7.1",
    "nest_asyncio==1.6.0",
    "pytest-xdist>=3.6.1",
]

[build-system]
requires = ["maturin>=1.15,<2.0"]
build-backend = "maturin"

[tool.maturin]
manifest-path = "native/Cargo.toml"
# `abi3` targets CPython's stable ABI, so one `cp311-abi3` wheel per platform
# covers every supported GIL-enabled interpreter (free-threaded builds have no
# stable ABI and install from the sdist).
features = ["abi3", "python-extension"]
python-source = "src"
module-name = "tinker._native"
strip = true
exclude = [
  "src/**/__pycache__/**",
  "src/**/*.pyc",
]

[tool.maturin.sbom]
# Maturin's generated Rust SBOM records absolute build paths for local crates.
rust = false
auditwheel = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short"
xfail_strict = true
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
filterwarnings = [
  "error"
]

[tool.pyright]
# this enables practically every flag given by pyright.
# there are a couple of flags that are still disabled by
# default in strict mode as they are experimental and niche.
typeCheckingMode = "strict"
pythonVersion = "3.8"

exclude = [
    "_dev",
    ".venv",
    ".nox",
]

reportImplicitOverride = true
reportOverlappingOverload = false

reportImportCycles = false
reportPrivateUsage = false

[tool.deptry]
extend_exclude = [
    # Generated protobuf files import `google.protobuf` via the `protobuf` package
    "src/tinker/proto/.*",
    # Test files colocated with source — they legitimately import pytest (dev dep)
    ".*_test\\.py",
    # Stand-in for the compiled extension module in source checkouts; not shipped
    "src/tinker/_native\\.py",
]
known_first_party = ["tinker"]

[tool.deptry.per_rule_ignores]
# DEP001: module imported but not declared. These are intentional lazy imports
# with install-on-demand UX, or transitive deps guaranteed by a declared parent.
DEP001 = [
    "huggingface_hub",  # lazy import in cli/commands/checkpoint.py, prompts user to install
    "pydantic_core",    # transitive, guaranteed by pydantic
    "tml_tokenizers",   # lazy import, internal tooling only
]
# DEP002: declared but unused. These are runtime-required transitives not directly imported.
DEP002 = [
    "protobuf",  # used via `google.protobuf` in generated code
    "aiohttp",   # optional [aiohttp] extra
    "tiktoken",  # imported by the Kimi tokenizers' remote code in get_tokenizer
]
